# Builds the spike on GitHub's xcode-27 runner and uploads it to TestFlight (internal testing only), so the app
# reaches the iPhone without a Mac. Xcode Cloud remains the long-term route (docs/ci.md); this one exists because
# its onboarding needs Xcode on a Mac.
#
# Safety, because the repository is public and the key it uses can sign and upload as the account:
# - Manual trigger only (Actions → "Spike to TestFlight" → Run workflow). Never runs on pushes or pull requests,
#   so code from a fork can never reach the key.
# - The key lives only in the `testflight` environment, which is limited to `main` and needs Shamil's approval
#   for every run before any secret is handed to the job.
# - The .p8 is written to the runner's temp folder with owner-only permissions and deleted when the step ends;
#   nothing prints it. GitHub-hosted runners are discarded after each job.
#
# Environment `testflight`: secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the whole .p8 text, an Admin
# team key: Apple-managed signing needs Admin) and variable APPLE_TEAM_ID. Setup steps: docs/ci.md.
name: Spike to TestFlight

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode on the xcode-27 image (27.1 is a release; 27.2 is the release candidate until the image updates)
        type: choice
        options:
          - Xcode_27.1
          - Xcode_27.2
        default: Xcode_27.1

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/${{ inputs.xcode }}.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Unique per upload, as App Store Connect requires; run numbers only ever increase for this workflow.
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the testflight environment is set up
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$TEAM_ID" ] || missing+=("variable APPLE_TEAM_ID")
          [ -n "$ASC_KEY_ID" ] || missing+=("secret ASC_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ] || missing+=("secret ASC_ISSUER_ID")
          [ -n "$ASC_PRIVATE_KEY" ] || missing+=("secret ASC_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The testflight environment is missing: ${missing[*]} (see docs/ci.md)"
            exit 1
          fi
          case "$ASC_PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            *) echo "::error::ASC_PRIVATE_KEY must be the whole .p8 text, including the BEGIN and END lines"; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          make spike
          git diff --exit-code -- Spike/Spike.entitlements

      - name: Archive (ad-hoc signed, so the entitlements stay in the signature)
        # CODE_SIGNING_ALLOWED=NO would drop the entitlements; an ad-hoc signature keeps them for the export step
        # to re-sign with Apple-managed certificates. These are the flags Xcode Cloud's own archive uses.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Spike/Spike.xcodeproj -scheme Spike -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Spike.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Check the archive kept the Hotspot Configuration entitlement
        run: |
          app="$(find "$RUNNER_TEMP/Spike.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then echo "::error::No app found in the archive"; exit 1; fi
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true
          if ! grep -q com.apple.developer.networking.HotspotConfiguration "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::The archived app is signed without com.apple.developer.networking.HotspotConfiguration"
            exit 1
          fi
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
            printf '%s: %s\n' "$key" "$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")"
          done

      - name: Export, sign with Apple-managed certificates and upload to TestFlight
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -o pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Spike.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Summary
        run: |
          {
            echo "### Uploaded to TestFlight"
            echo "Build **$BUILD_NUMBER** of net.shamil.shutter-bridge.spike, built with ${{ inputs.xcode }}."
            echo "App Store Connect processes it for a few minutes. If the internal group isn't set to get"
            echo "builds automatically, add it there; then install from the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"
