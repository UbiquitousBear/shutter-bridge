# PTPKit is pure Swift with no Apple-only frameworks, so its tests also run on Linux. This check gives every
# codec change a test run on the PR. App builds and the hardware plan stay on Xcode Cloud (decision record).
name: PTPKit tests

on:
  pull_request:
    paths:
      - "Packages/PTPKit/**"
      - ".github/workflows/ptpkit.yml"
  push:
    branches: [main]
    paths:
      - "Packages/PTPKit/**"
      - ".github/workflows/ptpkit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.4-noble   # Swift 6.4, the compiler in Xcode 27
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/PTPKit
        run: swift test
