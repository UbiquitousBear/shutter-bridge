# Builds the production app (App/ShutterBridge.xcodeproj) with real Xcode 27 on GitHub's xcode-27 runner, unsigned,
# for the iOS Simulator and for a generic iPhone, runs the app's UI tests of the screens that need no camera in the iOS
# Simulator (I18), and runs every package's tests there, where the code behind `#if canImport(...)` is compiled too.
# No signing and no secrets, so it is safe on PRs from forks. packages-linux.yml runs the same package tests on Linux.
# Xcode Cloud's pull-request workflow (backlog section 8) comes when Shamil sets it up for the production app
# (docs/ci.md).
name: App build and package tests (Xcode 27)

on:
  pull_request:
    paths:
      - "Packages/**"
      - "App/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/**"
      - "AllPackages.xcworkspace/**"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "App/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/**"
      - "AllPackages.xcworkspace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    # The two app builds, a few minutes each, and the UI tests (I18: a Debug build for the simulator and a few minutes of
    # tests); the limit ends a hung build or a stuck simulator early.
    timeout-minutes: 45
    env:
      # 27.1 is the image default and a public release; switch to Xcode_27.2 once the image has the release
      # build (it currently symlinks the 27.2 release candidate there). Keep in step with spike-build.yml and the
      # packages job below.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Entitlements are wired into the app target
        # The unsigned builds below can't see entitlements (CODE_SIGNING_ALLOWED=NO drops them), so a lost
        # CODE_SIGN_ENTITLEMENTS or a lost key would only show at TestFlight time, or on the bench as every join
        # refused. Both of the app target's configurations must point at App/ShutterBridge.entitlements, and the file
        # must hold exactly the keys ticked on the App ID: Hotspot Configuration and iCloud with the app's container
        # (docs/ci.md), and the Info.plist must declare that container for Files. Adding a key (Multicast Networking,
        # once Apple grants it) means ticking it on the App ID first, then updating this list.
        run: |
          python3 - <<'EOF'
          import plistlib, re, sys
          problems = []
          pbxproj = open("App/ShutterBridge.xcodeproj/project.pbxproj", encoding="utf-8").read()
          # The app target's configurations are the ones that name its Info.plist.
          configs = {}
          for body, name in re.findall(r"isa = XCBuildConfiguration;\s*buildSettings = \{(.*?)\n\t\t\t\};\s*name = (\w+);", pbxproj, re.S):
              if re.search(r"^\s*INFOPLIST_FILE = Info\.plist;", body, re.M):
                  m = re.search(r"^\s*CODE_SIGN_ENTITLEMENTS = (.+?);", body, re.M)
                  configs[name] = m.group(1).strip('"') if m else None
          for name in ("Debug", "Release"):
              if name not in configs:
                  problems.append(f"no {name} configuration of the app target found in project.pbxproj")
              elif configs[name] != "ShutterBridge.entitlements":
                  problems.append(f"{name}: CODE_SIGN_ENTITLEMENTS is {configs[name]!r}, expected 'ShutterBridge.entitlements'")
          container = "iCloud.net.shamil.shutter-bridge"
          expected = {
              "com.apple.developer.networking.HotspotConfiguration": True,
              "com.apple.developer.icloud-container-identifiers": [container],
              "com.apple.developer.icloud-services": ["CloudDocuments"],
              "com.apple.developer.ubiquity-container-identifiers": [container],
          }
          try:
              with open("App/ShutterBridge.entitlements", "rb") as f:
                  entitlements = plistlib.load(f)
          except Exception as error:
              problems.append(f"App/ShutterBridge.entitlements can't be read as a property list: {error}")
          else:
              if entitlements != expected:
                  problems.append(f"App/ShutterBridge.entitlements holds {entitlements!r}, expected {expected!r}")
          try:
              with open("App/Info.plist", "rb") as f:
                  info = plistlib.load(f)
          except Exception as error:
              problems.append(f"App/Info.plist can't be read as a property list: {error}")
          else:
              entry = info.get("NSUbiquitousContainers", {}).get(container)
              if entry != {"NSUbiquitousContainerIsDocumentScopePublic": True,
                           "NSUbiquitousContainerName": "Shutter Bridge",
                           "NSUbiquitousContainerSupportedFolderLevels": "Any"}:
                  problems.append(f"App/Info.plist: NSUbiquitousContainers[{container}] is {entry!r}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

      - name: Build the app for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

      - name: Pick an iPhone simulator
        id: sim
        run: |
          id="$(.github/scripts/pick-iphone-simulator.sh)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: UI tests in the iOS Simulator (the screens that need no camera)
        # I18 (D14 (c)): ShutterBridgeUITests drives History, Settings and the Staging tab of the Debug app, which the
        # tests launch with -UITestFixture so it runs over an in-memory catalogue seeded with job records, staged files
        # and marks (AppUI's UITestFixture; no camera, no PTPSimulator). Unsigned, as the builds above: the Simulator
        # runs the linker's ad-hoc signature (unverified for the UI-test runner until this step's first run). Each test
        # may take at most three minutes, so a stuck screen fails its test rather than the job's limit.
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -only-testing:ShutterBridgeUITests \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$RUNNER_TEMP/uitests.log" | xcbeautify --renderer github-actions

      - name: UI test failures from the raw xcodebuild output
        if: ${{ failure() }}
        # xcbeautify shortens XCTest failures; print the lines naming the test, the assertion and any compile error.
        run: |
          f="$RUNNER_TEMP/uitests.log"
          [ -f "$f" ] || exit 0
          grep -E 'error:|failed|XCTAssert|Test Case .* (failed|passed)' "$f" | head -n 80 || true

  packages:
    # Every package's tests in the iOS Simulator, from AllPackages.xcworkspace at the root: one build-for-testing of
    # its AllPackageTests scheme (the ten test targets of the eight packages), so each module and Apple's SDK modules
    # are compiled once, then the tests. Tried on 12 Nov (#131): about 9 minutes on one runner, where five parallel
    # jobs that each compiled their packages' dependencies again took 12.6 minutes for the slowest and five runners
    # (#130), and the old one-package-after-another job about 33. Two jobs a run (this one and build) also leave
    # room under GitHub's five macOS jobs at once for a second run.
    name: Package tests
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # As the build job's: keep the two in step.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Every package and test target is in the workspace
        run: python3 .github/scripts/check-all-packages-workspace.py

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          id="$(.github/scripts/pick-iphone-simulator.sh)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build every package for testing
        env:
          SIM: ${{ steps.sim.outputs.id }}
        # Indexing while building is off (COMPILER_INDEX_STORE_ENABLE=NO): nothing on CI reads the index.
        run: |
          set -o pipefail
          xcodebuild build-for-testing -workspace AllPackages.xcworkspace -scheme AllPackageTests \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions

      - name: AppUI's tests, one at a time
        # Nearly all of AppUI's tests are main-actor bound, and Swift Testing starts every test at once, so in the
        # Simulator they queued for the main actor and the wait counted against each test's own time limit (a passing
        # run of about 240 tests already had a slowest of 56 s against the 60 s limits). One at a time, a limit
        # measures only the test (#109). The other packages' tests aren't main-actor bound and stay parallel.
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -workspace AllPackages.xcworkspace -scheme AllPackageTests \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:AppUITests -parallel-testing-enabled NO \
            | tee "$RUNNER_TEMP/appui.log" | xcbeautify --renderer github-actions

      - name: The other packages' tests
        if: ${{ !cancelled() }}
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -workspace AllPackages.xcworkspace -scheme AllPackageTests \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" \
            -skip-testing:AppUITests \
            | tee "$RUNNER_TEMP/rest.log" | xcbeautify --renderer github-actions

      - name: Failures from the raw xcodebuild output
        if: ${{ failure() }}
        # xcbeautify shortens Swift Testing failures to "Recorded an issue" and drops compiler crashes, so print the raw
        # lines that name the test and the expectation that failed, any compile error, and a crashed compiler's stack
        # dump (which names the file and declaration it was type-checking).
        run: |
          for log in build appui rest; do
            f="$RUNNER_TEMP/$log.log"
            [ -f "$f" ] || continue
            echo "--- $log ---"
            grep -E 'recorded an issue|Expectation failed|failed after|error:' "$f" | head -n 80 || true
            grep -E -A 12 'Stack dump:|Please submit a bug report|Assertion failed|Segmentation fault|While (evaluating|type-checking|emitting|SILGen)' "$f" | head -n 120 || true
          done
