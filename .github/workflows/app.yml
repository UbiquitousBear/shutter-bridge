# Builds the production app (App/ShutterBridge.xcodeproj) with real Xcode 27 on GitHub's xcode-27 runner, unsigned,
# for the iOS Simulator and for a generic iPhone, and runs every package's tests in the iOS Simulator, where the
# code behind `#if canImport(...)` is compiled too. No signing and no secrets, so it is safe on PRs from forks.
# packages-linux.yml runs the same tests on Linux. Xcode Cloud's pull-request workflow (backlog section 8) comes
# when Shamil sets it up for the production app (docs/ci.md).
name: App build and package tests (Xcode 27)

on:
  pull_request:
    paths:
      - "Packages/**"
      - "App/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "App/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    # About 6 minutes: the two app builds and PTPKit's tests. The limit ends a hung test run early.
    timeout-minutes: 30
    env:
      # 27.1 is the image default and a public release; switch to Xcode_27.2 once the image has the release
      # build (it currently symlinks the 27.2 release candidate there). Keep in step with spike-build.yml and the
      # packages job below.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Entitlements are wired into the app target
        # The unsigned builds below can't see entitlements (CODE_SIGNING_ALLOWED=NO drops them), so a lost
        # CODE_SIGN_ENTITLEMENTS or a lost key would only show at TestFlight time, or on the bench as every join
        # refused. Both of the app target's configurations must point at App/ShutterBridge.entitlements, and the file
        # must hold exactly the keys ticked on the App ID: Hotspot Configuration and iCloud with the app's container
        # (docs/ci.md), and the Info.plist must declare that container for Files. Adding a key (Multicast Networking,
        # once Apple grants it) means ticking it on the App ID first, then updating this list.
        run: |
          python3 - <<'EOF'
          import plistlib, re, sys
          problems = []
          pbxproj = open("App/ShutterBridge.xcodeproj/project.pbxproj", encoding="utf-8").read()
          # The app target's configurations are the ones that name its Info.plist.
          configs = {}
          for body, name in re.findall(r"isa = XCBuildConfiguration;\s*buildSettings = \{(.*?)\n\t\t\t\};\s*name = (\w+);", pbxproj, re.S):
              if re.search(r"^\s*INFOPLIST_FILE = Info\.plist;", body, re.M):
                  m = re.search(r"^\s*CODE_SIGN_ENTITLEMENTS = (.+?);", body, re.M)
                  configs[name] = m.group(1).strip('"') if m else None
          for name in ("Debug", "Release"):
              if name not in configs:
                  problems.append(f"no {name} configuration of the app target found in project.pbxproj")
              elif configs[name] != "ShutterBridge.entitlements":
                  problems.append(f"{name}: CODE_SIGN_ENTITLEMENTS is {configs[name]!r}, expected 'ShutterBridge.entitlements'")
          container = "iCloud.net.shamil.shutter-bridge"
          expected = {
              "com.apple.developer.networking.HotspotConfiguration": True,
              "com.apple.developer.icloud-container-identifiers": [container],
              "com.apple.developer.icloud-services": ["CloudDocuments"],
              "com.apple.developer.ubiquity-container-identifiers": [container],
          }
          try:
              with open("App/ShutterBridge.entitlements", "rb") as f:
                  entitlements = plistlib.load(f)
          except Exception as error:
              problems.append(f"App/ShutterBridge.entitlements can't be read as a property list: {error}")
          else:
              if entitlements != expected:
                  problems.append(f"App/ShutterBridge.entitlements holds {entitlements!r}, expected {expected!r}")
          try:
              with open("App/Info.plist", "rb") as f:
                  info = plistlib.load(f)
          except Exception as error:
              problems.append(f"App/Info.plist can't be read as a property list: {error}")
          else:
              entry = info.get("NSUbiquitousContainers", {}).get(container)
              if entry != {"NSUbiquitousContainerIsDocumentScopePublic": True,
                           "NSUbiquitousContainerName": "Shutter Bridge",
                           "NSUbiquitousContainerSupportedFolderLevels": "Any"}:
                  problems.append(f"App/Info.plist: NSUbiquitousContainers[{container}] is {entry!r}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

      - name: Build the app for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

      - name: Every package is tested in the iOS Simulator
        # The packages are split between this job (PTPKit) and the matrix below, grouped by how long each took (about
        # 2 to 8 minutes, mostly compiling its dependencies), so the slowest job sets the time. A new folder under
        # Packages/ must be added to one of them; this fails the run until it is.
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          workflow = pathlib.Path(".github/workflows/app.yml").read_text(encoding="utf-8")
          listed = set()
          for line in re.findall(r"^\s+packages: (.+)$", workflow, re.M):
              listed.update(line.strip().strip('"').split())
          listed.add("PTPKit")  # tested in this job
          present = {p.parent.name for p in pathlib.Path("Packages").glob("*/Package.swift")}
          missing, unknown = sorted(present - listed), sorted(listed - present)
          for name in missing:
              print(f"::error::Packages/{name} isn't tested in the iOS Simulator: add it to a group in app.yml")
          for name in unknown:
              print(f"::error::app.yml tests {name}, which has no Packages/{name}/Package.swift")
          sys.exit(1 if missing or unknown else 0)
          EOF

      - name: Pick an iPhone simulator
        id: sim
        run: |
          id="$(.github/scripts/pick-iphone-simulator.sh)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: PTPKit's tests in the iOS Simulator
        run: .github/scripts/test-packages-in-simulator.sh "${{ steps.sim.outputs.id }}" PTPKit

  packages:
    # The other packages' tests, in parallel with the job above. The xcode-27 label is free for public repositories,
    # and GitHub runs up to five macOS jobs of an account at once, so the five jobs of one run start together (a
    # second run at the same time waits for free runners). Each job compiles its packages' dependencies itself; the
    # groups are balanced on the times measured on 11 Nov (#128: PTPSimulator 7.7 min, AppUI 5.7, Catalogue 3.2,
    # ImportEngine 2.8, PhotosBridge 1.8, CameraTransport 3.5, BLEKit 2.9).
    name: Package tests (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PTPSimulator
            packages: PTPSimulator
          - name: AppUI
            packages: AppUI
          - name: CameraTransport, BLEKit
            packages: CameraTransport BLEKit
          - name: Catalogue, ImportEngine, PhotosBridge
            packages: Catalogue ImportEngine PhotosBridge
    env:
      # As the build job's: keep the two in step.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          id="$(.github/scripts/pick-iphone-simulator.sh)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Tests in the iOS Simulator
        run: .github/scripts/test-packages-in-simulator.sh "${{ steps.sim.outputs.id }}" ${{ matrix.packages }}
