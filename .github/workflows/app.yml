# Builds the production app (App/ShutterBridge.xcodeproj) with real Xcode 27 on GitHub's xcode-27 runner, unsigned,
# for the iOS Simulator and for a generic iPhone, and runs every package's tests in the iOS Simulator, where the
# code behind `#if canImport(...)` is compiled too. No signing and no secrets, so it is safe on PRs from forks.
# packages-linux.yml runs the same tests on Linux. Xcode Cloud's pull-request workflow (backlog section 8) comes
# when Shamil sets it up for the production app (docs/ci.md).
name: App build and package tests (Xcode 27)

on:
  pull_request:
    paths:
      - "Packages/**"
      - "App/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "App/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # 27.1 is the image default and a public release; switch to Xcode_27.2 once the image has the release
      # build (it currently symlinks the 27.2 release candidate there). Keep in step with spike-build.yml.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Entitlements are wired into the app target
        # The unsigned builds below can't see entitlements (CODE_SIGNING_ALLOWED=NO drops them), so a lost
        # CODE_SIGN_ENTITLEMENTS or a lost key would only show at TestFlight time, or on the bench as every join
        # refused. Both of the app target's configurations must point at App/ShutterBridge.entitlements, and the file
        # must hold exactly the keys ticked on the App ID: today Hotspot Configuration only (docs/ci.md). Adding a key
        # (Multicast Networking, once Apple grants it) means ticking it on the App ID first, then updating this list.
        run: |
          python3 - <<'EOF'
          import plistlib, re, sys
          problems = []
          pbxproj = open("App/ShutterBridge.xcodeproj/project.pbxproj", encoding="utf-8").read()
          # The app target's configurations are the ones that name its Info.plist.
          configs = {}
          for body, name in re.findall(r"isa = XCBuildConfiguration;\s*buildSettings = \{(.*?)\n\t\t\t\};\s*name = (\w+);", pbxproj, re.S):
              if re.search(r"^\s*INFOPLIST_FILE = Info\.plist;", body, re.M):
                  m = re.search(r"^\s*CODE_SIGN_ENTITLEMENTS = (.+?);", body, re.M)
                  configs[name] = m.group(1).strip('"') if m else None
          for name in ("Debug", "Release"):
              if name not in configs:
                  problems.append(f"no {name} configuration of the app target found in project.pbxproj")
              elif configs[name] != "ShutterBridge.entitlements":
                  problems.append(f"{name}: CODE_SIGN_ENTITLEMENTS is {configs[name]!r}, expected 'ShutterBridge.entitlements'")
          expected = {"com.apple.developer.networking.HotspotConfiguration": True}
          try:
              with open("App/ShutterBridge.entitlements", "rb") as f:
                  entitlements = plistlib.load(f)
          except Exception as error:
              problems.append(f"App/ShutterBridge.entitlements can't be read as a property list: {error}")
          else:
              if entitlements != expected:
                  problems.append(f"App/ShutterBridge.entitlements holds {entitlements!r}, expected {expected!r}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Pick an iPhone simulator
        id: sim
        # The first available iPhone on the newest iOS runtime this Xcode can run: no newer than its iOS Simulator
        # SDK (the image can hold runtimes from other Xcode versions) and no older than the deployment target, 27.0.
        # From simctl's JSON, with the python3 that ships with the image.
        run: |
          set -o pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK: $sdk"
          id="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          sdk = tuple(int(x) for x in sys.argv[1].split(".")[:2])
          floor = (27, 0)
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"\.iOS-(\d+)-(\d+)", runtime)
              return tuple(map(int, m.groups())) if m else None
          usable = [r for r in devices if version(r) and floor <= version(r) <= sdk]
          for r in sorted(usable, key=version, reverse=True):
              for d in devices[r]:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      print(d["udid"]); print(r, d["name"], file=sys.stderr); sys.exit(0)
          sys.exit(f"no available iPhone simulator on an iOS runtime from 27.0 to {sys.argv[1]}")
          ' "$sdk")"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build the app for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/ShutterBridge.xcodeproj -scheme ShutterBridge -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Package tests in the iOS Simulator
        # Every folder under Packages/ with a Package.swift, so a new package (BLEKit) is picked up when it lands.
        # Xcode names a single-product package's scheme after the product and adds "<Package>-Package" when there
        # are several; the -Package scheme is preferred because it holds every test target.
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: |
          set -o pipefail
          failed=()
          for dir in Packages/*/; do
            [ -f "$dir/Package.swift" ] || continue
            pkg="$(basename "$dir")"
            echo "::group::$pkg"
            # Tolerant probe: xcodebuild can print package-resolution lines before the JSON, and under bash -e a
            # failing substitution would end the step, so parse from the first "{" and fall back to the folder name.
            schemes="$(cd "$dir" && xcodebuild -list -json 2>/dev/null | python3 -c 'import json, sys; s = sys.stdin.read(); i = s.find("{"); d = json.loads(s[i:]) if i >= 0 else {}; print("\n".join((d.get("workspace") or d.get("project") or {}).get("schemes", [])))' || true)"
            if grep -qx "$pkg-Package" <<<"$schemes"; then scheme="$pkg-Package"; else scheme="$pkg"; fi
            echo "scheme: $scheme"
            raw="$RUNNER_TEMP/$pkg-test.log"
            # AppUI's tests run one at a time. Nearly all of them are main-actor bound, and Swift Testing starts every
            # test at once, so in the Simulator they queue for the main actor and the wait counts against each test's
            # own time limit: with about 240 tests a passing run already had a median of 45 s and a slowest of 56 s
            # against the 60 s limits, and larger suites went over. One at a time, a limit measures only the test.
            # The other packages' tests aren't main-actor bound and stay parallel.
            parallel=()
            if [ "$pkg" = AppUI ]; then parallel=(-parallel-testing-enabled NO); fi
            if ! (cd "$dir" && xcodebuild test -scheme "$scheme" -destination "platform=iOS Simulator,id=$SIM" \
                    "${parallel[@]}" | tee "$raw" | xcbeautify --renderer github-actions); then
              failed+=("$pkg")
              # xcbeautify shortens Swift Testing failures to "Recorded an issue" and drops compiler crashes, so
              # print the raw lines that name the test and the expectation that failed, any compile error, and a
              # crashed compiler's stack dump (which names the file and declaration it was type-checking).
              echo "--- $pkg: failures from the raw xcodebuild output ---"
              grep -E 'recorded an issue|Expectation failed|failed after|error:' "$raw" | head -n 80 || true
              grep -E -A 12 'Stack dump:|Please submit a bug report|Assertion failed|Segmentation fault|While (evaluating|type-checking|emitting|SILGen)' "$raw" | head -n 120 || true
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Package tests failed in the iOS Simulator: ${failed[*]}"
            exit 1
          fi
